services:
  nexora-db:
    image: postgres:16-alpine
    container_name: nexora-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-NexoraDevSecure123!}
      POSTGRES_DB: ${DB_NAME:-nexora_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nexora-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-nexora_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  nexora-redis:
    image: redis:7-alpine
    container_name: nexora-redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - nexora-redis-data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-nexora_redis_dev_secret}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-nexora_redis_dev_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: nexora-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@nexora.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-Admin123*Secure}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      nexora-db:
        condition: service_healthy

volumes:
  nexora-db-data:
  nexora-redis-data:
