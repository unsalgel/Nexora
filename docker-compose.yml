services:
  nexora-db:
    image: postgres:16-alpine
    container_name: nexora-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD .env içinde tanımlanmalı}
      POSTGRES_DB: ${DB_NAME:-NexoraDb}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nexora-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-NexoraDb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  nexora-redis:
    image: redis:7-alpine
    container_name: nexora-redis
    restart: always
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - nexora-redis-data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD .env içinde tanımlanmalı}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD .env içinde tanımlanmalı}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: nexora-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@nexora.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD .env içinde tanımlanmalı}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      nexora-db:
        condition: service_healthy

  nexora-api:
    profiles: ["app"]
    env_file:
      - .env
    build:
      context: .
      dockerfile: src/Nexora.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=nexora-db;Port=5432;Database=${DB_NAME:-NexoraDb};Username=${DB_USER:-postgres};Password=${DB_PASSWORD:?DB_PASSWORD tanımlanmalı}"
      ConnectionStrings__Redis: "nexora-redis:6379,abortConnect=false"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD tanımlanmalı}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY tanımlanmalı}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:?ADMIN_SEED_PASSWORD tanımlanmalı}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-admin@nexora.local}
      DemoSeedEnabled: ${DemoSeedEnabled:-false}
      DataProtection__KeysPath: /app/data/keys
      Frontend__BaseUrl: http://localhost:5173
    ports:
      - "127.0.0.1:5285:8080"
    volumes:
      - nexora-api-uploads:/app/wwwroot/uploads
      - nexora-api-keys:/app/data/keys
      - nexora-api-logs:/app/logs
    depends_on:
      nexora-db:
        condition: service_healthy
      nexora-redis:
        condition: service_healthy

volumes:
  nexora-db-data:
  nexora-redis-data:
  nexora-api-uploads:
  nexora-api-keys:
  nexora-api-logs:
