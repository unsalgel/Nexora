name: Nexora Guvenlik ve Kalite Taramasi (Security & SAST)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

# Varsayilan token yetkisini en aza indir; gereken job ek yetki ister
permissions:
  contents: read

# Ayni PR'a yeni commit gelince eski kosuyu iptal et
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Branch protection'da "required check" olarak bu KISA ve SABIT adlari secin
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Paketleri geri yukle
      run: dotnet restore Nexora.sln

    - name: NuGet zafiyet taramasi (zafiyet varsa build kirilir)
      env:
        DOTNET_CLI_UI_LANGUAGE: en
      run: |
        dotnet list Nexora.sln package --vulnerable --include-transitive 2>&1 | tee vuln.txt
        if grep -q "has the following vulnerable packages" vuln.txt; then
          echo "::error::Zafiyetli NuGet paketi bulundu"
          exit 1
        fi

    - name: Birim ve mimari testleri (NetArchTest dahil)
      run: dotnet test Nexora.sln --no-restore --verbosity normal --logger "trx;LogFileName=test-results.trx"

    - name: Test sonuclarini yukle
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results
        path: '**/test-results.trx'

  frontend:
    name: frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [Nexora.Web, Nexora.Admin]
    defaults:
      run:
        working-directory: src/${{ matrix.app }}
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: src/${{ matrix.app }}/package-lock.json

    - run: npm ci

    - name: Bagimlilik denetimi (yalnizca production bagimliliklari)
      run: npm audit --omit=dev --audit-level=high

    # package.json'da "build" betigi "tsc -b && vite build" gibi tip kontrolunu icermeli
    - name: Tip kontrolu ve build
      run: npm run build

  # Yalnizca PR'larda: PR'in YENI getirdigi zafiyetli bagimliliklari engeller
  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/dependency-review-action@v4
      with:
        fail-on-severity: high

  codeql:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
    - uses: actions/checkout@v4

    - name: .NET kurulumu
      if: matrix.language == 'csharp'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: CodeQL baslat
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        queries: security-extended

    - name: .NET derleme (CodeQL icin)
      if: matrix.language == 'csharp'
      run: dotnet build Nexora.sln --configuration Release

    - name: CodeQL analizini tamamla
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{ matrix.language }}"
