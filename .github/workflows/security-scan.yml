name: Nexora Guvenlik ve Kalite Taramasi (Security & SAST)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

# Varsayilan token yetkisini en aza indir; gereken job ek yetki ister
permissions:
  contents: read

# Ayni PR'a yeni commit gelince eski kosuyu iptal et
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Branch protection'da "required check" olarak bu KISA ve SABIT adlari secin
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexora_test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: nexora_tests
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nexora_test -d nexora_tests"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Paketleri geri yukle
      run: dotnet restore Nexora.sln

    - name: NuGet zafiyet taramasi (zafiyet varsa build kirilir)
      env:
        DOTNET_CLI_UI_LANGUAGE: en
      shell: bash
      run: |
        set -euo pipefail
        dotnet list Nexora.sln package --vulnerable --include-transitive --format json > nuget-audit.json 2> nuget-audit.stderr.txt
        if [ -s nuget-audit.stderr.txt ]; then
          cat nuget-audit.stderr.txt
          exit 1
        fi
        node scripts/check-nuget-audit.mjs nuget-audit.json

    - name: Birim ve mimari testleri (NetArchTest dahil)
      run: dotnet test Nexora.sln -c Release --no-restore --filter "Category!=Integration" --collect:"XPlat Code Coverage" --logger "trx;LogFileName=unit-results.trx"

    - name: Gercek PostgreSQL ve Redis entegrasyon testleri
      env:
        NEXORA_TEST_POSTGRES: 'Host=localhost;Port=5432;Database=nexora_tests;Username=nexora_test;Password=ci-test-only'
        NEXORA_TEST_REDIS: 'localhost:6379'
      run: dotnet test Nexora.sln -c Release --no-build --filter "Category=Integration" --logger "trx;LogFileName=integration-results.trx"

    - name: Test sonuclarini yukle
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          **/TestResults/**/*.trx
          **/TestResults/**/coverage.cobertura.xml
          nuget-audit.json
          nuget-audit.stderr.txt

  frontend:
    name: frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [Nexora.Web, Nexora.Admin]
    defaults:
      run:
        working-directory: src/${{ matrix.app }}
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: 'npm'
        cache-dependency-path: src/${{ matrix.app }}/package-lock.json

    - run: npm ci

    - name: Lint
      run: npm run lint

    - name: Node regression testleri
      run: npm run test

    - name: Bagimlilik denetimi
      run: npm audit --audit-level=high

    # package.json'da "build" betigi "tsc -b && vite build" gibi tip kontrolunu icermeli
    - name: Tip kontrolu ve build
      run: npm run build

  container-smoke:
    name: container-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Production Alpine API ve izole altyapi
      run: docker compose -p nexora-review-tests -f docker-compose.test.yml --profile smoke up -d --build --wait --wait-timeout 120
    - name: Gercek HTTP ve native codec smoke
      run: node scripts/smoke-api.mjs
    - name: Production eski kart endpointi kaldirildi
      run: node scripts/smoke-commerce.mjs
    - name: Izole gelistirme ortami
      run: docker compose -p nexora-review-tests -f docker-compose.test.yml -f docker-compose.browser-test.yml --profile smoke up -d --force-recreate --wait --wait-timeout 120 api
    - name: Development eski kart endpointi ve sepet regresyonlari
      run: node scripts/smoke-commerce.mjs
    - name: Izole tarayici cookie ve katalog regresyonlari
      run: |
        docker compose -p nexora-review-tests -f docker-compose.test.yml -f docker-compose.browser-test.yml --profile smoke up -d --force-recreate --wait --wait-timeout 120 api
        node scripts/smoke-review.mjs
    - name: Basarisizlikta container loglari
      if: failure()
      run: docker compose -p nexora-review-tests -f docker-compose.test.yml logs --no-color
    - name: Izole test konteynerlerini temizle
      if: always()
      run: docker compose -p nexora-review-tests -f docker-compose.test.yml --profile smoke down --remove-orphans

  # Yalnizca PR'larda: PR'in YENI getirdigi zafiyetli bagimliliklari engeller
  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/dependency-review-action@v4
      with:
        fail-on-severity: high

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Gitleaks gizli anahtar taramasi
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
    - uses: actions/checkout@v7

    - name: .NET kurulumu
      if: matrix.language == 'csharp'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: CodeQL baslat
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        queries: security-extended

    - name: .NET derleme (CodeQL icin)
      if: matrix.language == 'csharp'
      run: dotnet build Nexora.sln --configuration Release

    - name: CodeQL analizini tamamla
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{ matrix.language }}"
