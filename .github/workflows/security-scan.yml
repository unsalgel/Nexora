name: Nexora Guvenlik ve Kalite Taramasi (Security & SAST)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 4 * * 1'

jobs:
  backend-security:
    name: Backend Bagimlilik ve Guvenlik Taramasi (.NET)
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: .NET 8 SDK Kurulumu
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Paketleri Geri Yukle
      run: dotnet restore Nexora.sln

    - name: NuGet Zafiyet Taramasi (Vulnerability Scan)
      run: dotnet list package --vulnerable --include-transitive

    - name: Birim Testleri ve Dogrulama
      run: dotnet test Nexora.sln --no-restore --verbosity normal

  frontend-security:
    name: Frontend Bagimlilik Taramasi (NPM Audit)
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: Node.js Kurulumu
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: |
          src/Nexora.Web/package-lock.json
          src/Nexora.Admin/package-lock.json

    - name: Nexora.Web Guvenlik Denetimi ve Tip Kontrolu
      working-directory: src/Nexora.Web
      run: |
        npm ci
        npm audit --audit-level=high
        npm run build

    - name: Nexora.Admin Guvenlik Denetimi ve Tip Kontrolu
      working-directory: src/Nexora.Admin
      run: |
        npm ci
        npm audit --audit-level=high
        npm run build

  codeql-analysis:
    name: CodeQL Statik Kod Analizi (SAST)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: CodeQL Baslat
      uses: github/codeql-action/init@v3
      with:
        languages: 'csharp, javascript-typescript'

    - name: .NET Derleme (CodeQL Analizi Icin)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - run: |
        dotnet build Nexora.sln --configuration Release

    - name: CodeQL Analizini Tamamla
      uses: github/codeql-action/analyze@v3
